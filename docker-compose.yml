# Local MongoDB for Otaku:  docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: otaku-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["otaku_mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  otaku_mongo:
